<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0D1321"/>
    </linearGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="16" fill="url(#bgGrad2)" stroke="#1E293B" stroke-width="2"/>

  <!-- Top App Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#0A0F1D" stroke="#1E293B" stroke-width="1"/>
  <g transform="translate(40, 20)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M16 6 L26 10 L26 18 C26 23 16 27 16 27 C16 27 6 23 6 18 L6 10 Z" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <text x="44" y="22" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">ScamShield <tspan fill="#38BDF8">AI</tspan> · <tspan fill="#94A3B8" font-size="14" font-weight="500">Scanner Engine</tspan></text>
  </g>

  <!-- Left Input Column -->
  <g transform="translate(60, 110)">
    <text x="0" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">Analyze Suspicious Pitch</text>
    <text x="0" y="50" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="14">Paste text or URL from Telegram, WhatsApp, or Instagram.</text>

    <!-- Mode Selector Tabs -->
    <g transform="translate(0, 75)">
      <rect width="520" height="46" rx="12" fill="#0A0F1D" stroke="#1E293B" stroke-width="1"/>
      <rect x="4" y="4" width="168" height="38" rx="10" fill="#2563EB"/>
      <text x="88" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Text Analysis</text>
      <text x="260" y="28" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">URL Security</text>
      <text x="430" y="28" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Combined Fused</text>
    </g>

    <!-- Textarea Box -->
    <g transform="translate(0, 145)">
      <rect width="520" height="230" rx="16" fill="#0A0F1D" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8"/>
      <text x="20" y="35" fill="#E2E8F0" font-family="monospace" font-size="13">🚨 EXCLUSIVE VIP INVESTMENT OPPORTUNITY 🚨</text>
      <text x="20" y="65" fill="#E2E8F0" font-family="monospace" font-size="13">100% GUARANTEED PROFIT! Turn ₹10,000 into</text>
      <text x="20" y="95" fill="#E2E8F0" font-family="monospace" font-size="13">₹1,00,000 in 24 hours with ZERO RISK.</text>
      <text x="20" y="125" fill="#E2E8F0" font-family="monospace" font-size="13">Approved by RBI &amp; endorsed by top traders.</text>
      <text x="20" y="155" fill="#E2E8F0" font-family="monospace" font-size="13">Only 2 spots left! Send USDT to crypto wallet</text>
      <text x="20" y="185" fill="#E2E8F0" font-family="monospace" font-size="13">TRC20: TVh89x93j92kf920d02mds right now!</text>
      <text x="420" y="215" fill="#64748B" font-family="monospace" font-size="11">248 / 5000</text>
    </g>

    <!-- Submit Button -->
    <rect x="0" y="395" width="520" height="50" rx="14" fill="url(#blueGrad2)" filter="url(#boxShadow)"/>
    <text x="260" y="426" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Execute AI Scan Report →</text>
  </g>

  <!-- Right Dynamic 6-Step Pipeline Card -->
  <g transform="translate(640, 110)" filter="url(#boxShadow)">
    <rect width="500" height="490" rx="20" fill="#0A0F1D" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="30" y="45" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">Dynamic Analysis Pipeline</text>
    <text x="30" y="70" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">Zero-trust lexical multi-signal inspection sequence</text>

    <!-- Progress Bar -->
    <rect x="30" y="90" width="440" height="6" rx="3" fill="#1E293B"/>
    <rect x="30" y="90" width="370" height="6" rx="3" fill="#38BDF8"/>

    <!-- 6 Steps -->
    <g transform="translate(30, 120)">
      <!-- Step 1 Done -->
