        <circle cx="16" cy="16" r="14" fill="#065F46" stroke="#10B981" stroke-width="1"/>
        <text x="16" y="21" fill="#34D399" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
