        <circle cx="16" cy="16" r="14" fill="#065F46" stroke="#10B981" stroke-width="1"/>
        <text x="16" y="21" fill="#34D399" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
        <text x="45" y="16" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Checking URL signals &amp; security</text>
        <text x="45" y="32" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">SSRF validation with zero outbound network calls</text>
      </g>

      <!-- Step 4 Active -->
      <g transform="translate(0, 165)">
        <circle cx="16" cy="16" r="14" fill="#1E3A8A" stroke="#38BDF8" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="5" fill="#38BDF8"/>
        <text x="45" y="16" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Detecting suspicious scam indicators</text>
        <text x="45" y="32" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Extracting verbatim quote evidence snippets</text>
      </g>

      <!-- Step 5 Pending -->
      <g transform="translate(0, 220)">
        <circle cx="16" cy="16" r="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="16" y="21" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5</text>
        <text x="45" y="16" fill="#64748B" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Calculating risk score &amp; ceiling</text>
        <text x="45" y="32" fill="#475569" font-family="-apple-system, sans-serif" font-size="11">Fused weighted algorithm (60% Text / 40% URL)</text>
      </g>

      <!-- Step 6 Pending -->
      <g transform="translate(0, 275)">
        <circle cx="16" cy="16" r="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text x="16" y="21" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">6</text>
        <text x="45" y="16" fill="#64748B" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Synthesizing explainable AI report</text>
        <text x="45" y="32" fill="#475569" font-family="-apple-system, sans-serif" font-size="11">Formatting recommendations &amp; guidance</text>
      </g>
    </g>
