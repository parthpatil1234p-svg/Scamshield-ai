        <text x="45" y="32" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">Normalization &amp; character encoding check</text>
      </g>

      <!-- Step 2 Done -->
      <g transform="translate(0, 55)">
        <circle cx="16" cy="16" r="14" fill="#065F46" stroke="#10B981" stroke-width="1"/>
        <text x="16" y="21" fill="#34D399" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
        <text x="45" y="16" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Analyzing text patterns &amp; heuristics</text>
        <text x="45" y="32" fill="#64748B" font-family="-apple-system, sans-serif" font-size="11">9 rule-based risk indicator categories</text>
